name = "race-map-api"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ── KV namespace ──────────────────────────────────────────────────────────────
# After running `wrangler kv namespace create RACE_MAP_KV`, paste the
# returned id into the binding below.
[[kv_namespaces]]
binding = "RACE_MAP_KV"
id = "f33c3f5b2d6c493f90642bb3137e54a5"

# Preview KV (used by `wrangler dev`) — create with:
# wrangler kv namespace create RACE_MAP_KV --preview
# then paste the preview_id here
preview_id = "f6101d3888da40649b00e5cae09e6f10"

# ── Cron Triggers ─────────────────────────────────────────────────────────────
# Fires every 6 hours to refresh polls + news into KV
[triggers]
crons = ["0 */6 * * *"]
